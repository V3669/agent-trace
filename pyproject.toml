[project]
name = "agenttrace"
version = "0.1.0"
description = "Local token-waste profiler for AI coding agents"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Vigi", email = "kartha.vighnesh@gmail.com" }]
readme = "README.md"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn>=0.34",
    "httpx[http2]>=0.28",
    "duckdb>=1.5,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "anyio>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agenttrace = "agenttrace.cli:app"

[tool.poetry]
packages = [{ include = "agenttrace" }]
requires-poetry = ">=2.1"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.10"
pre-commit = ">=3.7"
pip-audit = ">=2.7"

[tool.poetry.group.test.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
respx = ">=0.21"
hypothesis = ">=6.100"
httpx2 = "^2.2.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "UP", "SIM", "TID"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agenttrace"]
branch = true

[tool.coverage.report]
# CLI/presentation layer tested via e2e/manual; coverage gate targets core modules.
omit = [
    "agenttrace/cli.py",
    "agenttrace/report/renderer.py",
    "agenttrace/webui/*",
]
fail_under = 85
